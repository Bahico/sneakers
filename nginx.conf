server {
  listen 443 ssl; # managed by Certbot
  server_name sneakerteam.ru www.sneakerteam.ru;

  location / {
    proxy_pass http://185.28.85.192:4300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  ssl_certificate /etc/letsencrypt/live/api.sneakerteam.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/api.sneakerteam.ru/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
