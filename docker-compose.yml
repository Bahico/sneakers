version: "1"

services:
  angular-ssr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sneakers-frontend
    ports:
      - "4300:4300"
    environment:
      - PORT=4300
    restart: unless-stopped


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ssr
