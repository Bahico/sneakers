<tui-segmented
  class="black-segment p-1"
  size="l"
  [(activeItemIndex)]="activeSegment"
>
  <button
    type="button"
    class="w-1/3 !px-2`"
    [class.active]="0 === activeSegment()"
  >
    <span class="line-clamp-2 text-wrap text-xs md:text-base">В пункт выдачи СДЭК</span>
  </button>
  <button
    type="button"
    class="w-1/3 !px-1"
    [class.active]="1 === activeSegment()"
  >
    <span class="line-clamp-2 text-wrap text-xs md:text-base">Курьером <br class="md:hidden"> СДЭК</span>
  </button>
  <button
    type="button"
    class="w-1/3 !px-1"
    [class.active]="2 === activeSegment()"
  >
    <span class="line-clamp-2 text-wrap text-xs md:text-base">Почтой <br class="md:hidden"> России</span>
  </button>
</tui-segmented>

<div class="mt-4" (click)="openModal.emit(true)">
  @switch (activeSegment()) {
    @case (0) {
      <div class="sn-control w-full cursor-pointer">
        <icon-list icon="location" class="sn-control-icon" />
        <input type="text" [readOnly]="readonly()" placeholder="Введите город, пункт выдачи">
      </div>
    }
    @case (1) {
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <div class="sn-control col-span-2 md:col-span-4">
          <icon-list icon="location" class="sn-control-icon" />
          <input type="text" [readOnly]="readonly()" placeholder="Найдите адрес">
        </div>
        <div class="sn-control">
          <input type="text" [readOnly]="readonly()" placeholder="Квартира">
        </div>
        <div class="sn-control">
          <input type="text" [readOnly]="readonly()" placeholder="Подъезд">
        </div>
        <div class="sn-control">
          <input type="text" [readOnly]="readonly()" placeholder="Этаж">
        </div>
        <div class="sn-control">
          <input type="text" [readOnly]="readonly()" placeholder="Домофон">
        </div>
        <div class="sn-control col-span-2 md:col-span-4">
          <icon-list icon="message" class="sn-control-icon" />
          <input type="text" [readOnly]="readonly()" placeholder="Введите комментарий для курьера">
        </div>
      </div>
    }
    @default {
      <div class="sn-control w-full cursor-pointer">
        <icon-list icon="location" class="sn-control-icon" />
        <input type="text" [readOnly]="readonly()" placeholder="Найдите адрес">
      </div>
    }
  }
</div>
