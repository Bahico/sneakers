@if (form()) {
  @let delivery_type = form().controls.delivery_type.value;
  <tui-segmented
    class="black-segment p-1"
    size="l"
    [activeItemIndex]="deliveryTypeKeys[delivery_type]"
    (activeItemIndexChange)="form().controls.delivery_type.setValue(deliveryTypeValues[$event])"
  >
    <button
      type="button"
      class="w-1/3 px-2!"
      [class.active]="deliveryTypeValues[0] === delivery_type"
    >
      <span class="line-clamp-2 text-wrap text-xs md:text-base">В пункт выдачи СДЭК</span>
    </button>
    <button
      type="button"
      class="w-1/3 px-1!"
      [class.active]="deliveryTypeValues[1] === delivery_type"
    >
      <span class="line-clamp-2 text-wrap text-xs md:text-base">Курьером <br class="md:hidden"> СДЭК</span>
    </button>
    <button
      type="button"
      class="w-1/3 px-1!"
      [class.active]="deliveryTypeValues[2] === delivery_type"
    >
      <span class="line-clamp-2 text-wrap text-xs md:text-base">Почтой <br class="md:hidden"> России</span>
    </button>
  </tui-segmented>

  <div class="mt-4" (click)="openModal.emit(true)">
    @switch (delivery_type) {
      @case ('cdek_pickup') {
        <div class="sn-control w-full cursor-pointer">
          <icon-list icon="location" class="sn-control-icon" />
          <input type="text" [readOnly]="readonly()" placeholder="Введите город, пункт выдачи">
        </div>
      }
      @case ('cdek_courier') {
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <div class="sn-control col-span-2 md:col-span-4">
            <icon-list icon="location" class="sn-control-icon"/>
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Найдите адрес"
              [(ngModel)]="formService.courier.address"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
          <div class="sn-control">
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Квартира"
              [(ngModel)]="formService.courier.apartment"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
          <div class="sn-control">
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Подъезд"
              [(ngModel)]="formService.courier.entrance"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
          <div class="sn-control">
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Этаж"
              [(ngModel)]="formService.courier.floor"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
          <div class="sn-control">
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Домофон"
              [(ngModel)]="formService.courier.intercom"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
          <div class="sn-control col-span-2 md:col-span-4">
            <icon-list icon="message" class="sn-control-icon"/>
            <input
              type="text"
              [readOnly]="readonly()"
              placeholder="Введите комментарий для курьера"
              [(ngModel)]="formService.courier.comment"
              (ngModelChange)="changeDeliveryData()"
            >
          </div>
        </div>
      }
      @default {
        <div
          class="sn-control w-full cursor-pointer"
          [tuiDropdown]="dropdown"
          [tuiDropdownManual]="openSuggestions()"
          [tuiObscuredEnabled]="openSuggestions()"
          (click)="openSuggestions.set(true)"
          (tuiActiveZoneChange)="onActiveZone($event)"
          (tuiObscured)="onObscured($event)"
        >
          <icon-list icon="location" class="sn-control-icon"/>
          <input
            type="text"
            [readOnly]="readonly()"
            placeholder="Найдите адрес"
            [(ngModel)]="suggestionSearch"
            [ngModelOptions]="{standalone: true}"
            (ngModelChange)="suggestionSearchEvent$.next()"
          >

          <ng-template #dropdown>
            <tui-data-list>
              @for (item of suggestions(); track item.value) {
                <button tuiOption (click)="selectSuggestion(item)">
                  {{ item.value }} {{item.unrestricted_value}}
                </button>
              }
            </tui-data-list>
          </ng-template>
        </div>
      }
    }
  </div>

}
