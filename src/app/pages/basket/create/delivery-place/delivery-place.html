<div
  class="bg-black/30 transition-all duration-300 fixed inset-0 z-30 opacity-0 hidden md:block"
  (click)="open.set(false)"
  [class.!opacity-100]="open()"
  [class.pointer-events-none]="!open()"
  [class.pointer-events-auto]="open()"
></div>
<div
  class="fixed top-1/2 left-1/2 transform -translate-x-1/2 z-40 hidden md:flex justify-center items-center transition-all duration-300 opacity-0"
  [ngClass]="{
    'pointer-events-none translate-y-10': !open(),
    'opacity-100! -translate-y-1/2': open()
  }"
>
  <span class="absolute -right-10 md:-right-14 -top-2 cursor-pointer">
    <icon-list icon="close" class="w-10 h-10 text-white" (click)="open.set(false)" />
  </span>
  <div class="grid md:grid-cols-2 p-0 md:p-4 w-[80vw] gap-4 md:h-200 md:w-[70vw]! xl:min-w-250! bg-white rounded-xl overflow-hidden">
    <ng-container *ngTemplateOutlet="content" />
  </div>
</div>

<div class="flex flex-col gap-4 md:hidden">
  <ng-container *ngTemplateOutlet="content" />
</div>

<ng-template #content>

  <div class="md:p-4 flex flex-col gap-4">
    <h2 class="text-xl font-semibold">Выбери пункт выдачи</h2>
    <delivery-type-inputs [form]="form()" />
  </div>
  <div class="h-100 md:h-full">
    <ya-map
      (ready)="onMapReady($event)"
      [center]="[55.751952, 37.600739]"
      [zoom]="12"
      (boundschange)="onChange($event)"
      (yaclick)="onMapClick($event)"
    >
      @switch (delivery_type()) {
        @case ('cdek_pickup') {
          @for (suggestion of suggestions(); track suggestion.value) {
            <ya-placemark
              [geometry]="[suggestion.data.geo_lat, suggestion.data.geo_lon]"
              [properties]="{ id: suggestion.value }"
              [options]="{
                preset: suggestionId() === suggestion.value ? 'islands#redIcon' : 'islands#blueIcon'
              }"
              (ready)="onPlacemarkReady($event, suggestion)"
            />
          }
        }
        @case ('cdek_courier') {
          @if (locationData()) {
            <ya-placemark
              [geometry]="[locationData().lat, locationData().lon]"
              [options]="{
                preset: 'islands#blueIcon'
              }"
            />
          }
        }
      }
    </ya-map>
  </div>
</ng-template>
