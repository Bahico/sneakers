<div class="grid grid-cols-2 w-full md:h-100">
  <div>
    <tui-segmented
      class="colors p-1"
      size="l"
      [(activeItemIndex)]="activeSegment"
    >
      <button
        type="button"
        class="w-1/3"
        [class.active]="0 === activeSegment()"
      >
        В пункт выдачи СДЭК
      </button>
      <button
        type="button"
        class="w-1/3"
        [class.active]="1 === activeSegment()"
      >
        Курьером СДЭК
      </button>
      <button
        type="button"
        class="w-1/3"
        [class.active]="2 === activeSegment()"
      >
        Почтой России
      </button>
    </tui-segmented>
    <div class="sn-control w-full cursor-pointer">
      <icon-list icon="location" class="sn-control-icon" />
      <input type="text" placeholder="Введите город, пункт выдачи">
    </div>
  </div>
  <div class="h-full">
    <ya-map [center]="[55.751952, 37.600739]" [zoom]="12">
      <ya-placemark [geometry]="[55.751952, 37.600739]"></ya-placemark>
    </ya-map>
  </div>
</div>
