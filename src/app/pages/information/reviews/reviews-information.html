<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    <a *tuiItem tuiLink routerLink="/">
      Главная
    </a>
    <div *tuiItem class="text-primary">Отзывы</div>
  </tui-breadcrumbs>

  <h2 class="text-xl md:text-2xl lg:text-3xl font-semibold text-primary mb-10">Отзывы от покупателей sneakerteam.ru
  </h2>

  <div class="flex flex-col md:flex-row gap-4 md:gap-10 items-center mb-10">
    <div class="text-base md:text-lg lg:text-xl font-semibold text-primary text-center md:text-left">
      Почитать все отзывы и оставить свой можно в отдельном Telegram канале по ссылке:
    </div>
    <div class="sn-btn py-4! px-6! w-full md:w-auto justify-center md:justify-start">
      <a href="https://t.me/sneakerteam_ru" target="_blank"
         class="flex items-center gap-4 justify-center md:justify-start">
        Читать отзывы
        <icon-list icon="telegram-outline"/>
      </a>
    </div>
  </div>

  <div class="relative max-w-300 flex md:block justify-center">
    @if (scrolling() !== 0) {
      <span
        class="absolute -left-2 md:left-0 top-1/2 -translate-y-1/2 w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-3xl text-primary cursor-pointer"
        (click)="previous()">
        <i class="fa fa-angle-left" aria-hidden="true"></i>
      </span>
    }

    <div
      #scrollContainer
      class="flex items-end md:gap-4 overflow-hidden max-w-70 md:max-w-300 pb-4 duration-150 scroll-smooth"
      [ngClass]="{' md:ml-14': scrolling() !== 0}"
    >
      <img
        ngSrc="/images/information/review-1.png"
        alt="Отзывы"
        [class]="getItemClass(0)"
        width="100" height="100"
        class="review"
      >
      <img ngSrc="images/information/review-2.png" alt="Отзывы"
           [class]="getItemClass(1)"
           width="100" height="100">
      <img ngSrc="images/information/review-3.png" alt="Отзывы"
           [class]="getItemClass(2)"
           width="100" height="100">
      <img ngSrc="images/information/review-4.png" alt="Отзывы"
           [class]="getItemClass(3)"
           width="100" height="100">
      <img ngSrc="images/information/review-5.png" alt="Отзывы"
           [class]="getItemClass(4)"
           width="100" height="100">
      <img ngSrc="images/information/review-7.png" alt="Отзывы"
           [class]="getItemClass(5)"
           width="100" height="100">
      <img ngSrc="images/information/review-8.png" alt="Отзывы"
           [class]="getItemClass(6)"
           width="100" height="100">
      <img ngSrc="images/information/review-9.png" alt="Отзывы"
           [class]="getItemClass(7)"
           width="100" height="100">
    </div>

    @if (scrolling() < 4) {
      <span
        class="absolute -right-2 md:-right-16 top-1/2 -translate-y-1/2 w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-3xl text-primary cursor-pointer"
        (click)="next()">
        <i class="fa fa-angle-right" aria-hidden="true"></i>
      </span>
    }
  </div>
</div>
