<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    @for (item of items; track $index) {
      <a
        *tuiItem
        tuiLink
        [routerLink]="item.routerLink"
        [class.!text-primary]="$last"
      >
        {{ item.caption }}
      </a>
    }
  </tui-breadcrumbs>

  <h1 class="text-3xl font-semibold text-primary">Оплата</h1>

  <h3 class="text-xl font-semibold text-primary mt-10 mb-4">Способы оплаты</h3>
  <p>При оформлении заказа вы сможете выбрать способ доставки и указать данные получателя. В нашем сервисе вы можете оплатить свой заказ любым удобным для вас способом:</p>

  <div class="mt-4 flex gap-3">
    <img ngSrc="images/bank/sber.png" alt="">
  </div>
</div>
