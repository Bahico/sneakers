<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">

      Главная

  <h1 class="text-xl lg:text-3xl font-bold text-center md:text-start mb-2 md:mb-4">Контакты</h1>

  <div class="w-full rounded-2xl bg-gray-100 border border-gray-200 p-4 grid md:grid-cols-4 gap-2">

      <a class="flex gap-3 p-2" href="https://t.me/sneakerteamru" target="_blank">
        <span class="w-10 md:w-15 h-10 md:h-15 flex justify-center items-center rounded-md bg-white text-primary">
          <icon-list icon="telegram-outline"/>
        </span>

        <div class="flex flex-col gap-2 text-white">
          <span class="text-base md:text-lg font-semibold">{{ '@sneakerteamru' }}</span>
          <span>Телеграм</span>
        </div>
      </a>

      <a class="flex gap-3 p-2" href="https://www.instagram.com/sneakerteam.ru?igsh=NGxpcm96NWszMm15" target="_blank">
        <span class="w-10 md:w-15 h-10 md:h-15 flex justify-center items-center rounded-md bg-white text-primary text-2xl">
          <i class="fa fa-instagram" aria-hidden="true"></i>

        <div class="flex flex-col gap-2 text-white">
          <span class="text-base md:text-lg font-semibold">{{ '@sneakerteam.ru' }}</span>
          <span>Инстаграм</span>

    <div class="hidden md:block"></div>
    <div class="hidden md:block"></div>

    <a class="flex gap-3 p-2 pl-4" href="https://t.me/sneakerteamru" target="_blank">

          <icon-list icon="telegram-outline"/>
        </span>

      <div class="flex flex-col gap-2 text-primary">
        <span class="text-base md:text-lg font-semibold">{{ '@sneaker_team_bot' }}</span>
        <span>Telegram-бот</span>
      </div>
    </a>

    <a class="flex gap-3 p-2 pl-4 md:pl-2" href="https://t.me/sneakerteam_feedback" target="_blank">

          <icon-list icon="telegram-outline"/>
        </span>

        <span class="text-base md:text-lg font-semibold">{{ '@sneakerteam_feedback' }}</span>

    <a class="flex gap-3 p-2 pl-4 md:pl-2" href="https://www.youtube.com/@sneakerteamru" target="_blank">
