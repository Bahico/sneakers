<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    <a *tuiItem tuiLink routerLink="/">
      Главная
    </a>
    <div *tuiItem class="text-primary">Приложение</div>
  </tui-breadcrumbs>

  <div class="flex items-center gap-10">
    <div class="flex flex-col gap-12">
      <h3 class="text-3xl font-semibold">Приложение</h3>
      <span class="max-w-90">Официальное приложение магазина на русском языке. Не нужно скачивать – работает прямо внутри Telegram</span>

      <div>
        <button class="sn-btn w-50 !py-3 flex justify-center items-center gap-2">
          Перейти
          <icon-list icon="telegram-outline" />
        </button>
      </div>
    </div>

    <img ngSrc="images/information/application.png" alt="" height="300" width="300">
  </div>
</div>
