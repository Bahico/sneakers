<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    <a *tuiItem tuiLink routerLink="/">
      Главная
    </a>
    <div *tuiItem class="text-primary">Приложение</div>
  </tui-breadcrumbs>

  <div class="flex items-center gap-10 flex-col md:flex-row">
    <div class="flex flex-col gap-4 md:gap-12">
      <h3 class="text-lg md:text-2xl lg:text-4xl font-semibold text-center md:text-start">Приложение</h3>
      <span class="max-w-90 text-base text-center md:text-start">Официальное приложение магазина на русском языке. Не
        нужно скачивать – работает прямо внутри Telegram</span>

      <div class="flex md:block justify-center">
        <a href="https://t.me/sneaker_team_bot" target="_blank" rel="noopener"
          class="sn-btn w-50 !py-3 flex justify-center items-center gap-2">
          Перейти
          <icon-list icon="telegram-outline" />
        </a>
      </div>
    </div>

    <img ngSrc="images/information/application.png" alt="" height="300" width="300">
  </div>
</div>
