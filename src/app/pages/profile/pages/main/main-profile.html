<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    <a *tuiItem tuiLink routerLink="/">
      Главная
    </a>
    <div *tuiItem class="text-primary">Управление профилем</div>
  </tui-breadcrumbs>

  <h1 class="text-xl text-center  md:text-start md:text-2xl lg:text-4xl font-semibold mb-4 md:mb-10">Управление профилем</h1>

  <div class="flex flex-col md:flex-row justify-between w-full gap-4">
    <div class="flex flex-col gap-4 w-full md:w-100">
      <div class="flex gap-2">
        <span class="flex w-10 h-10 justify-center items-center rounded-full bg-primary text-white">
          {{ initials }}
        </span>

        <div class="flex flex-col gap-0.5">
          <span class="text-lg font-semibold">{{ fullName || '—' }}</span>
          <span class="text-sm text-gray-500">{{ telegramHandle }}</span>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex justify-between">
          <span class="font-semibold">Телефон:</span>
          <span>{{ phone || 'Не указан' }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-semibold">Почта:</span>
          <span>{{ extendedAccount()?.email || 'Не указана' }}</span>
        </div>
      </div>

      <button class="sn-btn w-full" routerLink="../edit">Изменить данные</button>
    </div>

    <profile-menu />
  </div>
</div>
