<div
  class="border-gray-200 pb-3"
  [class.border-b]="!last()"
  [routerLink]="detail().order_number"
>
  <div class="flex justify-between mb-4">
    <div class="flex flex-col gap-4">
      <span class="text-sm md:text-lg font-semibold flex">№<div>{{detail().order_number}}</div></span>
    </div>

  </div>

  <div class="flex w-full gap-2 overflow-y-auto">
    @for (item of detail().items; track item.id) {
      <div class="min-w-38 w-38 flex flex-col gap-2">
        <div
          class="w-full h-38 bg-secondary rounded-md cursor-pointer"
        >
          <img
            [src]="item.product_image_url"
            alt=""
            [style.mix-blend-mode]="'multiply'"
            class="w-full h-full object-contain"
          >
        </div>

        <div>
          <h3 class="text-lg font-semibold">{{item.brand_name}}</h3>
          <span class="text-sm text-black/40">{{ item.product_name }}</span>
        </div>
      </div>
    }
  </div>
</div>
