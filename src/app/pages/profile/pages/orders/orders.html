<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    <a *tuiItem tuiLink routerLink="/">
      Главная
    </a>
    <div *tuiItem class="text-primary">Заказы</div>
  </tui-breadcrumbs>

  <h1 class="text-xl text-center md:text-start md:text-2xl lg:text-4xl font-semibold mb-4 md:mb-10">
    Заказы
  </h1>

  <div class="flex flex-col md:flex-row justify-between w-full gap-10">
    <div class="flex flex-col w-full md:max-w-150 gap-2">
      <form class="sn-control w-full" (ngSubmit)="navigateOrder()">
        <icon-list icon="search" class="sn-control-icon"/>

        <input
          type="number"
          [(ngModel)]="search"
          [ngModelOptions]="{standalone: true}"
          placeholder="Введите номер заказа"
        >
      </form>
      <router-outlet />
    </div>

    <profile-menu/>
  </div>
</div>
