<div class="container mb-10 mt-5 md:mt-0">
  <banner/>

  <div class="flex gap-4 items-center justify-center mb-10 md:mb-0 mt-5 md:mt-0">
    <button
      class="sn-btn gray !rounded-4xl w-1/2 md:w-60 md:h-12 md:!py-0 font-semibold"
      routerLink="/home/male"
      routerLinkActive="!bg-primary !text-white"
    >
      Мужское
    </button>
    <button
      class="sn-btn gray !rounded-4xl w-1/2 md:w-60 md:h-12 md:!py-0 font-semibold"
      routerLink="/home/female"
      routerLinkActive="!bg-primary !text-white"
    >
      Женское
    </button>
  </div>

  <category-shoes [gender]="gender()"/>
  <category-cloth [gender]="gender()" class="mt-10 flex flex-col"/>
  <category-accessories [gender]="gender()" class="mt-10 flex flex-col"/>

  <div class="flex justify-center">
    <div
      (click)="openCalculate()"
      class="p-2 rounded-xl bg-gray-100 w-full md:w-[70%] flex justify-between items-center cursor-pointer"
    >
      <div class="flex gap-2 md:gap-4 items-center w-[70%]">
        <img ngSrc="images/logo/poizon.png" class="w-10 md:w-15 h-10 md:h-15 object-contain rounded-xl" alt="" height="92" width="92">
        <span class="md:text-xl font-semibold">Рассчитать стоимость товара из Poizon</span>
      </div>

      <span class="text-2xl md:text-4xl mr-4">
        <i class="fa fa-angle-right" aria-hidden="true"></i>
      </span>
    </div>
  </div>
</div>
