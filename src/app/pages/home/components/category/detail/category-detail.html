<div class="w-full">
  <div class="flex justify-between">
    <h2 class="text-xl font-semibold hidden md:block">Покупки в реальном времени</h2>
    <h2 class="text-lg font-semibold md:hidden">Покупки сейчас</h2>
    <span class="flex items-center text-xs gap-1 px-3 py-1 bg-gray-100 rounded-2xl">
      Все
      <i class="fa fa-angle-right" aria-hidden="true"></i>
    </span>
  </div>

  <div class="flex w-full">
    <button (click)="previous()"
      class="min-h-full ml-auto min-w-8 bg-white items-center justify-center hidden md:flex text-2xl cursor-pointer">
      <i class="fa fa-angle-left" aria-hidden="true"></i>
    </button>

    <div #scrollContainer class="flex overflow-x-auto overflow-y-hidden gap-2 hidden-scrollbar mt-4 w-full">
      @if (products().length) {
      @for (product of products(); track $index) {
      <a class="min-w-44 w-44 md:min-w-[168px] md:w-[168px] flex flex-col gap-2"
        [href]="'/product/detail/' + product.id">
        <div class="h-44 md:h-56 bg-gray-100 rounded-md px-2 py-3 flex items-center justify-center">
          <img [src]="product.images[0]" [alt]="product.name" class="w-full h-full object-contain"
            style="mix-blend-mode: multiply;" />
        </div>
        <div class="space-y-1">
          <h4 class="truncate md:text-lg font-semibold">{{ product.brand.name }}</h4>
          <p class="text-xs md:text-sm text-gray-400 truncate">{{ product.name }}</p>
          <span class="text-sm md:text-base font-semibold">{{ product.price }} р.</span>
          <div class="flex gap-0.5 items-center">
            <span class="py-0.5 px-1 bg-primary/80 rounded text-white text-xs">{{ product.split }} р. x 2</span>
            <span class="text-gray-500 text-xs">Сплит</span>
          </div>
        </div>
      </a>
      }
      } @else {
      <div data-empty-state="last-sold-empty"
        class="min-w-full min-h-44 flex items-center justify-center text-center text-sm text-gray-400 px-4">
        Пока нет покупок в этом разделе
      </div>
      }
    </div>

    <button (click)="next()"
      class="min-h-full ml-auto min-w-8 bg-white items-center justify-center hidden md:flex text-2xl cursor-pointer">
      <i class="fa fa-angle-right" aria-hidden="true"></i>
    </button>
  </div>
</div>
