<div class="w-full flex flex-col">
  <div class="flex justify-between w-full">
    <h2 class="text-xl font-semibold">Аксессуары</h2>

    <span class="flex items-center text-xs gap-1 px-3 py-1 bg-gray-100 rounded-2xl">
      Все категории
      <i class="fa fa-angle-right" aria-hidden="true"></i>
    </span>
  </div>

  <div class="grid grid-cols-12 gap-2 md:gap-4 mt-4">
    <div
      class="h-30 md:h-90 px-3 py-2 rounded-md cursor-pointer bg-gray-100 relative overflow-hidden col-span-7 md:col-span-5"
      style="background-image: url('images/background/gray-bg.svg'); background-size: cover; background-position: center"
    >
        <span class="font-semibold text-sm md:text-3xl">
          Сумки <br />и рюкзаки
        </span>

      @if (gender() === 'male') {
        <img ngSrc="images/home/acc-1.png" width="100" height="100" class="h-auto w-30 md:w-90 object-contain absolute -right-4 -bottom-12 md:-bottom-34 " alt="">
      } @else {
        <img ngSrc="images/home/acc-female-1.png" width="100" height="100" class="h-auto w-30 md:w-120 object-contain absolute -right-7 md:-right-15 bottom-3 md:-bottom-2 " alt="">
      }
    </div>
    <div
      class="h-30 md:h-90 px-3 py-2 rounded-md cursor-pointer bg-gray-100 relative overflow-hidden col-span-5 md:col-span-3"
      style="background-image: url('images/background/gray-bg.svg'); background-size: cover; background-position: center"
    >
        <span class="font-semibold text-sm md:text-3xl">
          Часы
        </span>

      @if (gender() === 'male') {
        <img ngSrc="images/home/acc-2.png" width="100" height="100" class="h-auto w-20 md:min-w-50 object-contain absolute right-2 md:-right-3 -bottom-10 md:-bottom-8" alt="">
      } @else {
        <img ngSrc="images/home/acc-female-2.png" width="100" height="100" class="h-auto w-30 md:min-w-80 object-contain absolute -right-10 md:-right-20 -bottom-4 md:bottom-4" alt="">
      }
    </div>
    <div
      class="h-30 md:h-90 px-3 py-2 rounded-md cursor-pointer bg-gray-100 relative overflow-hidden col-span-5 md:col-span-4"
      style="background-image: url('images/background/gray-bg.svg'); background-size: cover; background-position: center"
    >
        <span class="font-semibold text-sm md:text-3xl">
          Очки
        </span>
      @if (gender() === 'male') {
        <img ngSrc="images/home/acc-3.png" width="100" height="100" class="h-auto w-90 md:w-120 object-contain absolute -right-10 md:-right-30 bottom-5 md:bottom-10 " alt="">
      } @else {
        <img ngSrc="images/home/acc-female-3.png" width="100" height="100" class="h-auto w-90 md:w-120 object-contain absolute -right-10 md:-right-30 bottom-5 md:bottom-10 " alt="">
      }
    </div>
    <div
      class="h-30 md:h-90 px-3 py-2 rounded-md cursor-pointer bg-gray-100 relative overflow-hidden col-span-7 md:col-span-6"
      style="background-image: url('images/background/gray-bg.svg'); background-size: cover; background-position: center"
    >
        <span class="font-semibold text-sm md:text-3xl">
          Кошельки
        </span>

      @if (gender() === 'male') {
        <img ngSrc="images/home/acc-4.png" width="100" height="100" class="h-auto w-30 md:w-90 object-contain absolute -right-2 -bottom-3 rotate-y-180" alt="">
      } @else {
        <img ngSrc="images/home/acc-female-4.png" width="100" height="100" class="h-auto w-40 md:w-140 object-contain absolute -right-12 md:-right-12 bottom-2 md:bottom-0 rotate-y-180" alt="">
      }
    </div>
    <div
      class="h-30 md:h-90 px-3 py-2 rounded-md cursor-pointer bg-gray-100 relative overflow-hidden col-span-12 md:col-span-6"
      style="background-image: url('images/background/gray-bg.svg'); background-size: cover; background-position: center"
    >
        <span class="font-semibold text-sm md:text-3xl">
          Карточницы
        </span>
      @if (gender() === 'male') {
        <img ngSrc="images/home/acc-5.png" width="100" height="100" class="h-auto w-36 md:w-90 object-contain absolute -right-1 md:-right-4 -bottom-5 " alt="">
      } @else {
        <img ngSrc="images/home/acc-female-5.png" width="100" height="100" class="h-auto w-36 md:w-120 object-contain absolute -right-1 md:-right-10 -bottom-5 " alt="">
      }
    </div>
  </div>
</div>
