<div class="flex gap-2 text-sm items-center text-gray-600 cursor-pointer" (click)="openFeedback()">
  <i class="fa fa-star-o"></i>
  <span>Оставить отзыв</span>
</div>

<h1 class="text-2xl font-bold text-primary mt-2">{{detail().name}}</h1>

<div class="mt-4 flex gap-4 items-center">
  <span class="text-xl font-bold text-primary">{{data$()?.price_without_discount | tuiFormatNumber | async}} р.</span>
  <div class="select-none bg-[#DEDEDE] flex gap-2 p-1 rounded-md items-center cursor-pointer" (click)="openCoin()">
    <div class="bg-primary text-white rounded-md py-1 px-2 text-xs">
      S
    </div>
    <span>+{{percentage()}} за покупку</span>
  </div>
</div>
