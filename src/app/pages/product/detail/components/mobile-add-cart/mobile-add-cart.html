<h3 class="text-xl font-semibold mb-2">Добавлено в карзину</h3>

<div class="flex gap-4">
  <div class="w-30 h-30 bg-gray-200 rounded-md">
    <img
      [src]="detail().images?.[0]"
      class="w-full h-full object-cover"
      alt=""
      style="mix-blend-mode: multiply;"
    >
  </div>

  <div class="flex flex-col justify-between">
    <span class="text-lg font-semibold">{{detail().name}}</span>

    <div class="flex flex-col gap-1">
      <span class="text-gray-500 text-sm">EU {{selectedSku().size.primary}} - RU {{selectedSku().size['ru']}}</span>
      <div class="flex items-center gap-2">
        <div
          class="text-primary cursor-pointer w-8 h-8 flex items-center justify-center rounded-md bg-gray-200"
          (click)="cart().quantity === 1 ? removeFromCart() : decrease()"
        >
          <icon-list [icon]="cart().quantity === 1 ? 'trash-outline-sm' : 'minus-sm'" />
        </div>

        <span class="select-none">{{cart().quantity}}</span>

        <div
          class="text-primary cursor-pointer w-8 h-8 flex items-center justify-center rounded-md bg-gray-200"
          (click)="increase()"
        >
          <icon-list icon="plus-sm" />
        </div>
      </div>
    </div>
  </div>
</div>

<div class="w-full flex flex-col mt-6 gap-2">
  <button
    class="sn-btn default w-full"
    (click)="close()"
    routerLink="/products/filter"
  >
    Продолжить покупки
  </button>
  <button
    class="sn-btn w-full"
    (click)="close()"
    routerLink="/basket"
  >
    Перейти в корзину
  </button>
</div>
