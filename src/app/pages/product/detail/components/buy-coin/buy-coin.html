<div class="flex w-full flex-col gap-4 items-center text-center">
  <h1 class="text-2xl font-semibold">Покупай и получай <br class="md:hidden"> Sneaker Coins</h1>
  <p class="w-3/4">Зарегистрируйтесь и начните получать Sneaker Coins — бонусы, которые можно потратить на оплату следующих заказов.</p>

  <config-infos />

  <div class="flex flex-col md:flex-row gap-2 w-full">
    <button class="sn-btn w-full md:w-1/2 !py-3" (click)="openAuthentication()">
      Войти / Зарегистрироваться
    </button>
    <button class="sn-btn gray w-full md:w-1/2 !py-3" (click)="close()">
      Продолжить как гость
    </button>
  </div>
</div>
