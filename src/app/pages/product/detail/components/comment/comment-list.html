<h3 class="font-semibold text-2xl">Отзывы на этот товар</h3>

<div class="flex flex-col gap-3">
  <div class="flex gap-2">
    <h4 class="text-4xl font-semibold">5.0</h4>
    <div>
      <span class="flex gap-0.5">
        <icon-list icon="star" />
        <icon-list icon="star" />
        <icon-list icon="star" />
        <icon-list icon="star" />
        <icon-list icon="star" />
      </span>
      <div class="flex gap-2 text-gray-500">
        <span>29 оценок</span>
        <span>20 отзывов</span>
      </div>
    </div>
  </div>
</div>

<div class="border border-primary rounded w-full md:w-100 items-center justify-center gap-4 px-4 py-2 md:py-3 flex cursor-pointer" (click)="openFeedback()">
  <span class="md:text-xl">Оставить отзыв</span>
  <div class="select-none bg-gray-100 flex gap-2 p-2 rounded-md items-center cursor-pointer">
    <div class="bg-primary text-white rounded-md py-1 px-2 text-xs">
      S
    </div>
    <span>+500 за покупку</span>
  </div>
</div>

@for (comment of [1, 2]; track comment) {
  <comment-detail class="border-b border-gray-200" [class.border-b-0]="$last" />
}
<button class="sn-btn secondary w-full mt-2 !py-3 text-lg">
  Смотреть все отзывы
</button>
