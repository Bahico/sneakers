<span class="line mt-6 mb-4"></span>

<div class="flex items-center justify-between mb-4">
  <h4 class="text-lg font-bold text-primary">Расцветки</h4>

  <a class="flex items-center cursor-pointer text-[12px] rounded-3xl px-2 py-1 bg-[#DEDEDE] gap-2" routerLink="/product/{{gender()}}/{{productDetailStore.detail()?.category?.name}}">
    <span>Показать все</span>
    <i class="fa fa-angle-right"></i>
  </a>
</div>

<div class="flex gap-1 h-30">
  <div
    class="h-full transition-all duration-300 cursor-pointer flex items-center justify-center overflow-hidden text-xl"
    [class.w-0]="disablePrevious()"
    [class.w-10]="!disablePrevious()"
    (click)="previous()"
  >
    <i class="fa fa-angle-left"></i>
  </div>

  <div class="w-full h-full overflow-x-auto hidden-scrollbar flex gap-2">
    @for (color of colors(); track $index) {
      <div
        #thumb
        [ngClass]="{
          'border-primary': $index === activeIndex()
        }"
        routerLink="/product/detail/{{color.id}}"
        (click)="setActiveIndex($index)"
        class="w-1/3 min-w-1/3 h-full border-black/20 border rounded-md"
      >
        <img
          [src]="color.images?.[0]"
          class="w-full h-full object-contain"
          alt=""
          [style.mix-blend-mode]="'multiply'"
        >
      </div>
    }
  </div>
  <div
    class="h-full transition-all duration-300 cursor-pointer flex items-center justify-center overflow-hidden text-xl"
    [class.w-0]="disableNext()"
    [class.w-10]="!disableNext()"
    (click)="next()"
  >
    <i class="fa fa-angle-right"></i>

  </div>
</div>
