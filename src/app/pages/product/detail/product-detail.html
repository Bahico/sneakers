<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    @for (item of items(); track $index) {
      <a
        *tuiItem
        tuiLink
        [routerLink]="item.routerLink"
        [class.!text-primary]="$last"
        class="last:truncate"
      >
        {{ item.caption }}
      </a>
    }
  </tui-breadcrumbs>

  <div class="flex flex-col md:flex-row relative w-full gap-6 md:gap-8 mb-10">
    <product-images
      class="w-full md:w-[65%] md:sticky top-2"
      style="align-self: flex-start;"
    />

    <div class="w-full md:w-124 bg-secondary rounded-2xl py-4 px-5">
      <product-detail-name />
      <product-detail-size />
      <product-detail-order />
      <product-detail-color />
      <connect-infos />
    </div>
  </div>

  <comment-list />

  <similar-products class="mt-20 flex flex-col"/>
</div>
