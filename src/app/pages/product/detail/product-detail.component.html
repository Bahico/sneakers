<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4" (click)="loadProduct(7536140)">
    @for (item of items; track $index) {
      <a
        *tuiItem
        tuiLink
        [routerLink]="item.routerLink"
        [class.!text-primary]="$last"
      >
        {{ item.caption }}
      </a>
    }
  </tui-breadcrumbs>

  <div class="flex flex-col md:flex-row relative w-full gap-6">
    <product-images
      class="w-full md:w-[65%] md:sticky top-0"
    />

    <div class="w-full md:w-[35%] bg-secondary rounded-2xl p-4">
      <product-detail-name />
      <product-detail-size />
      <product-detail-order />
      <product-detail-color />
      <connect-infos />
    </div>
  </div>
</div>
