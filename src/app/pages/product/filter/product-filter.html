<div class="container mb-10 mt-5 md:mt-0">
  <tui-breadcrumbs class="mb-4">
    @for (item of items(); track $index) {
      <a
        *tuiItem
        tuiLink
        [routerLink]="item.routerLink"
        [class.!text-primary]="$last"
      >
        {{ item.caption }}
      </a>
    }
  </tui-breadcrumbs>

  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div class="col-span-1 flex flex-col gap-4">
      <h3 class="text-2xl font-semibold">Фильтры</h3>

      <div class="flex w-full items-center gap-1">
        <span class="flex px-3 py-0.5 bg-gray-100 rounded-xl text-nowrap">От {{formControl.value?.[0]}} р.</span>
        <tui-range
          size="m"
          [formControl]="formControl"
          [max]="10"
          class="w-full"
          [style.--tui-thickness.rem]="0.5"
          [style.--tui-background-accent-1]="'#222'"
        />
        <span class="flex px-3 py-0.5 bg-gray-100 rounded-xl text-nowrap">До {{formControl.value?.[1]}} р.</span>
      </div>

      <div class="flex flex-col overflow-hidden w-full">
        <div class="flex gap-2 items-center cursor-pointer" (click)="changeOpen( 'size')">
          <icon-list [icon]="openFilters().size ? 'plus' : 'minus'" class="text-primary" />
          <span class="text-lg text-primary font-semibold">Размер</span>
        </div>
      </div>

    </div>
    <div class="md:col-span-2 lg:col-span-3">

    </div>
  </div>
</div>
