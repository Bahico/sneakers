<div class="flex flex-col gap-2 mt-4">
  <div class="sn-control">
    <span class="sn-control-icon">
      <icon-list icon="search"/>
    </span>

    <input
      type="text"
      [(ngModel)]="search"
      [ngModelOptions]="{standalone: true}"
      (ngModelChange)="searchBrand()"
      placeholder="Введите бренд"
    >
  </div>

  <div class="flex flex-col gap-2 mt-4">
    @for (letter of lettersArraySorted(); track letter) {
      <div class="flex flex-col gap-1">
        <span class="font-semibold">{{ letter }}</span>

        @for (brand of letters()[letter]; track $index) {
          <div class="flex gap-1">
            <input
              tuiCheckbox
              type="checkbox"
              [ngModel]="checkBrand(brand.id)"
              [ngModelOptions]="{standalone: true}"
              (ngModelChange)="clickBrand(brand.id)"
              size="s"
              [id]="brand.id"
            />
            <label class="cursor-pointer" [for]="brand.id">{{ brand.name }}a</label>
          </div>
        }
      </div>
    }
  </div>
</div>
