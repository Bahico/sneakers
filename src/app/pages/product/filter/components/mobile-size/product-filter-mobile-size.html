<div class="flex flex-col gap-2 overflow-hidden">
  <tui-tabs class="items-center">
    @for (size of sizeTable; track $index) {
      <button
        tuiTab
        type="button"
        class="h-5"
      >
        {{size}}
      </button>
    }
  </tui-tabs>

  <div class="grid grid-cols-5 gap-x-1 gap-y-4 mt-2">
    @for (size of sizes; track $index) {
      <div class="flex gap-1 border-[0.65px] border-primary rounded-md items-center justify-center h-10">
        <label>{{size}}</label>
      </div>
    }
  </div>
</div>
