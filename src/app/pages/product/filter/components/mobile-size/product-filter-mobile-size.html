<div class="flex flex-col gap-2 overflow-hidden">
  <tui-tabs [(activeItemIndex)]="activeIndex">
    @for (size of sizeTables(); track size.type) {
      <button
        tuiTab
        type="button"
      >
        {{size.type}}
      </button>
    }
  </tui-tabs>

  <div class="grid grid-cols-5 gap-x-1 gap-y-4 mt-2">
    @for (size of sizeTables()?.[activeIndex()]?.values; track size) {
      <div
        class="flex gap-1 border-[0.65px] rounded-md items-center justify-center h-10 cursor-pointer"
        [class.border-primary]="!checkSize(size)"
        [class.bg-primary]="checkSize(size)"
        [class.text-white]="checkSize(size)"
        (click)="clickSize(size)"
      >
        <label class="cursor-pointer">{{size}}</label>
      </div>
    }
  </div>
</div>
