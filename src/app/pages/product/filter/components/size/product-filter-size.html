<div class="flex flex-col gap-2 overflow-hidden px-2">
  <tui-tabs>
    @for (size of sizeTable; track $index) {
      <button
        tuiTab
        type="button"
      >
        {{size}}
      </button>
    }
  </tui-tabs>

  <div class="grid grid-cols-2 gap-2 mt-2">
    @for (size of sizes; track $index) {
      <div class="flex gap-1">
        <input
          tuiCheckbox
          type="checkbox"
          [ngModel]="false"
          size="s"
        />
        <label>{{size}}</label>
      </div>
    }
  </div>
</div>
